name: PR preview

on:
  pull_request:
    branches: [main]

jobs:
  # Draft PRs from the admin app may only touch the editable surface.
  path-guard:
    if: startsWith(github.head_ref, 'draft/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify only editable paths changed
        run: |
          set -e
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"; echo "$CHANGED"
          BAD=$(echo "$CHANGED" | grep -Ev \
            -e '^src/content/news/[a-z0-9-]+\.md$' \
            -e '^src/data/extra-slides\.json$' \
            -e '^public/media/uploads/[0-9]{4}/[0-9]{2}/[A-Za-z0-9._-]+$' \
            || true)
          if [ -n "$BAD" ]; then
            echo "::error::Draft PR touches files outside the editable surface:"; echo "$BAD"
            exit 1
          fi

  preview:
    runs-on: ubuntu-latest
    needs: [path-guard]
    # run for human PRs too (path-guard is skipped for non-draft branches)
    if: always() && (needs.path-guard.result == 'success' || needs.path-guard.result == 'skipped')
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mega33-cloud
          expires: 7d
